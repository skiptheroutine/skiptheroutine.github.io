name = "app-struc-use-counter"
main = "counter.js"
compatibility_date = "2024-11-01"

# Replace with your GitHub Pages origin, e.g. "https://you.github.io"
# (no trailing slash, no path).
[vars]
ALLOWED_ORIGIN = "https://REPLACE-WITH-YOUR-GITHUB-USERNAME.github.io"

# Create with: wrangler kv namespace create USE_COUNTS
# then paste the returned id below.
kv_namespaces = [
  { binding = "USE_COUNTS", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]
